<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELLO</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
}

#warp-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

.container {
    position: relative;
    z-index: 1;
    width: min(1200px, 92%);
    margin: 0 auto;
    padding: 80px 0 140px;
    text-align: center;
}

h1 {
    font-size: 70px;
    margin: 0 0 40px;
    color: white;
    letter-spacing: 6px;
    text-shadow:
        0 0 10px #0ff,
        0 0 25px #0ff,
        0 0 50px #0ff;
}

.search-wrapper {
    width: min(520px, 90%);
    margin: 0 auto 60px;
}

#searchInput {
    width: 100%;
    padding: 18px 28px;
    font-size: 20px;
    border-radius: 999px;
    border: 2px solid #0ff;
    outline: none;
    color: white;
    background: rgba(0, 20, 30, 0.75);
    box-shadow: 0 0 25px rgba(0,255,255,0.5);
}

#searchInput::placeholder {
    color: rgba(0,255,255,0.55);
}

/* 关键：用 grid，不会重叠 */
#gameGrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 48px;
    width: 100%;
    align-items: stretch;
}

/* 每张卡片自己占完整高度 */
.game-card {
    position: relative;
    min-height: 230px;
    padding: 34px 22px;
    border-radius: 18px;
    background: rgba(12, 12, 20, 0.96);
    box-shadow: 0 0 30px rgba(0,255,255,0.25);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game-card::before {
    content: "";
    position: absolute;
    inset: -2px;
    background: conic-gradient(#0ff, #f0f, #0ff);
    z-index: -2;
    animation: spin 5s linear infinite;
}

.game-card::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 15px;
    background: #0b0b12;
    z-index: -1;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.game-card h3 {
    font-size: 30px;
    margin: 0 0 25px;
    text-shadow: 0 0 10px white;
}

.game-card p {
    color: #aab3d0;
    margin: 0 0 30px;
    font-size: 17px;
}

.play-btn {
    display: inline-block;
    padding: 12px 40px;
    border-radius: 999px;
    border: 2px solid #f0f;
    color: #f0f;
    text-decoration: none;
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 2px;
    box-shadow: 0 0 18px rgba(255,0,255,0.55);
}

.play-btn:hover {
    background: #f0f;
    color: white;
}

.empty {
    margin-top: 40px;
    color: #aaa;
    font-size: 20px;
}

@media (max-width: 700px) {
    h1 {
        font-size: 48px;
    }

    #gameGrid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<canvas id="warp-canvas"></canvas>

<div class="container">
    <h1>HELLO</h1>

    <div class="search-wrapper">
        <input id="searchInput" placeholder="Initialize search sequence...">
    </div>

    <div id="gameGrid"></div>
    <div id="empty" class="empty" style="display:none;">No games found</div>
</div>

<script>
const games = [
    { title: "Minecraft", folder: "minecraft", desc: "Sandbox" },
    { title: "Geometry Dash", folder: "geometry-dash", desc: "Rhythm" },
    { title: "Hollow Knight", folder: "hollow-knight", desc: "Action" },
    { title: "Level Devil", folder: "level-devil", desc: "Trap Game" },

    { title: "Command & Conquer", folder: "command-and-conquer", desc: "Strategy" },
    { title: "2048", folder: "2048", desc: "Puzzle" },
    { title: "Clumsy Bird", folder: "clumsy-bird", desc: "Arcade" },
    { title: "3D Chess", folder: "3D-Hartwig-chess", desc: "Board Game" }
];
const grid = document.getElementById("gameGrid");
const search = document.getElementById("searchInput");
const empty = document.getElementById("empty");

function render(list) {
    grid.innerHTML = "";

    if (list.length === 0) {
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    list.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
            <h3>${game.title}</h3>
            <p>${game.desc}</p>
            <a class="play-btn" href="game.html?folder=${encodeURIComponent(game.folder)}">PLAY</a>
        `;
        grid.appendChild(card);
    });
}

search.addEventListener("input", () => {
    const keyword = search.value.toLowerCase().trim();
    const filtered = games.filter(game =>
        game.title.toLowerCase().includes(keyword) ||
        game.desc.toLowerCase().includes(keyword)
    );
    render(filtered);
});

render(games);

/* 星空背景 */
const canvas = document.getElementById("warp-canvas");
const ctx = canvas.getContext("2d");
let w, h;
let stars = [];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

class Star {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = (Math.random() - 0.5) * 2400;
        this.y = (Math.random() - 0.5) * 2400;
        this.z = Math.random() * 1200 + 1;
    }

    update() {
        this.z -= 7;
        if (this.z <= 1) this.reset();
    }

    draw() {
        const x = this.x / this.z * 360 + w / 2;
        const y = this.y / this.z * 360 + h / 2;
        const size = Math.max(1, 3 - this.z / 400);
        ctx.fillStyle = "#0ff";
        ctx.fillRect(x, y, size, size);
    }
}

for (let i = 0; i < 450; i++) {
    stars.push(new Star());
}

function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, w, h);

    stars.forEach(star => {
        star.update();
        star.draw();
    });

    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
