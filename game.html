<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.topbar {
    height: 54px;
    background: #050814;
    color: white;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 18px;
    box-sizing: border-box;
    border-bottom: 1px solid rgba(0,255,255,0.35);
}

.back-link {
    color: #0ff;
    text-decoration: none;
    font-weight: bold;
}

#gameTitle {
    margin: 0;
    font-size: 22px;
    color: #0ff;
    text-shadow: 0 0 12px #0ff;
}

.frame-wrap {
    width: 100%;
    height: calc(100vh - 54px);
    background: #000;
}

#gameFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #000;
}
</style>
</head>

<body>

<div class="topbar">
    <a class="back-link" href="index.html">← Back</a>
    <h1 id="gameTitle">Loading...</h1>
</div>

<div class="frame-wrap">
    <iframe id="gameFrame" allowfullscreen></iframe>
</div>

<script>
const games = [
    { title: "Minecraft", folder: "minecraft" },
    { title: "Geometry Dash", folder: "geometry-dash" },
    { title: "Hollow Knight", folder: "hollow-knight" },
    { title: "Level Devil", folder: "level-devil" },

    { title: "Command & Conquer", folder: "command-and-conquer" },
    { title: "2048", folder: "2048" },
    { title: "Clumsy Bird", folder: "clumsy-bird" },
    { title: "3D Chess", folder: "3D-Hartwig-chess" },
    { title: "Silksong", folder: "Hollow-Knight-Silksong" }
];

const params = new URLSearchParams(location.search);
const folder = params.get("folder");

const game = games.find(g => g.folder === folder);

const title = document.getElementById("gameTitle");
const frame = document.getElementById("gameFrame");

if (game) {
    title.textContent = game.title;
    frame.src = "games/" + game.folder + "/index.html";
} else {
    title.textContent = "Game not found";
}
</script>

</body>
</html>
